<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Kata Sandi - TerraSense Agri</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=DM+Serif+Display:ital@0;1&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --sage:        #5a8a60;
            --sage-light:  #7ab880;
            --terracotta:  #c67b5c;
            --bark:        #f0e8d8;
            --bark-dim:    rgba(240,232,216,0.6);
            --bark-muted:  rgba(240,232,216,0.35);
            --base:        #080d08;
            --surface:     #111811;
            --input-bg:    rgba(255,255,255,0.05);
            --input-border:rgba(255,255,255,0.1);
        }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--base);
            color: var(--bark);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .bg-canvas { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
        .bg-blob { position: absolute; border-radius: 50%; filter: blur(100px); pointer-events: none; }
        .bg-blob-1 { width: 600px; height: 600px; background: radial-gradient(circle, rgba(90,138,96,0.1) 0%, transparent 70%); top: -200px; left: -200px; animation: blobFloat 20s ease-in-out infinite; }
        .bg-blob-2 { width: 500px; height: 500px; background: radial-gradient(circle, rgba(198,123,92,0.07) 0%, transparent 70%); bottom: -150px; right: -150px; animation: blobFloat 25s ease-in-out infinite reverse; }
        .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(90,138,96,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(90,138,96,0.025) 1px, transparent 1px); background-size: 60px 60px; mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 20%, transparent 80%); }

        @keyframes blobFloat { 0%, 100% { transform: translate(0,0) scale(1); } 50% { transform: translate(20px,-30px) scale(1.05); } }

        .auth-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 540px;
            margin: 20px;
            background: #0c130c;
            padding: 48px 44px;
            border-radius: 28px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 40px 120px rgba(0,0,0,0.5);
            animation: cardIn 0.7s cubic-bezier(0.16,1,0.3,1) both;
        }

        @keyframes cardIn { from { opacity: 0; transform: translateY(20px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

        .auth-icon-top { font-size: 48px; color: var(--sage); margin-bottom: 24px; text-align: center; }
        
        .auth-form-header { margin-bottom: 32px; text-align: center; }
        .auth-form-header h2 { font-family: 'DM Serif Display', serif; font-size: 1.8rem; font-weight: 400; color: var(--bark); margin-bottom: 6px; }
        .auth-form-header p { font-size: 0.85rem; color: var(--bark-muted); line-height: 1.6; }

        .form-group { margin-bottom: 18px; }
        .form-label { display: block; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--bark-muted); margin-bottom: 8px; }
        .form-input-wrap { position: relative; }
        .form-input-wrap .input-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--bark-muted); font-size: 18px; pointer-events: none; transition: color 0.2s; }
        
        .form-input {
            width: 100%; background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 12px;
            padding: 13px 44px; font-family: 'Inter', sans-serif; font-size: 0.9rem; color: var(--bark); outline: none; transition: all 0.2s ease;
        }
        .form-input:focus { border-color: rgba(90,138,96,0.6); background: rgba(90,138,96,0.05); box-shadow: 0 0 0 3px rgba(90,138,96,0.1); }
        .form-input:focus + .input-icon { color: var(--sage-light); }

        .btn-submit {
            width: 100%; padding: 14px; border-radius: 12px; background: linear-gradient(135deg, var(--sage) 0%, #3d7045 100%);
            color: #fff; font-family: 'Inter', sans-serif; font-size: 0.95rem; font-weight: 700; border: none; cursor: pointer;
            box-shadow: 0 4px 20px rgba(90,138,96,0.3); transition: all 0.25s ease; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 8px;
        }
        .btn-submit:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(90,138,96,0.4); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none !important; }

        .alert { padding: 12px 16px; border-radius: 10px; font-size: 0.85rem; margin-bottom: 16px; display: none; align-items: flex-start; gap: 10px; }
        .alert.error   { background: rgba(248,113,113,0.12); border: 1px solid rgba(248,113,113,0.3); color: #f87171; }
        .alert.success { background: rgba(52,211,153,0.12);  border: 1px solid rgba(52,211,153,0.3);  color: #34d399; }
        .alert.show    { display: flex; }

        .spinner { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .back-link {
            display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 24px;
            font-size: 0.8rem; color: var(--bark-muted); text-decoration: none; transition: color 0.2s;
        }
        .back-link:hover { color: var(--bark); }
    </style>
</head>
<body>
    <div class="bg-canvas">
        <div class="bg-blob bg-blob-1"></div>
        <div class="bg-blob bg-blob-2"></div>
        <div class="bg-grid"></div>
    </div>

    <div class="auth-wrapper">
        <div class="auth-icon-top"><i class="ph-fill ph-plant"></i></div>
        
        <div class="auth-form-header">
            <h2>Lupa Kata Sandi?</h2>
            <p>Masukkan email yang terdaftar untuk menerima tautan pemulihan kata sandi.</p>
        </div>

        <div id="alert-box" class="alert"></div>
        
        <form id="forgot-form">
            <div class="form-group">
                <label class="form-label" for="reset-email">Email Terdaftar</label>
                <div class="form-input-wrap">
                    <input type="email" id="reset-email" class="form-input" placeholder="petani@contoh.com" required autocomplete="email">
                    <span class="material-symbols-outlined input-icon" style="left:auto;right:14px;">mail</span>
                </div>
            </div>
            
            <button type="submit" id="submit-btn" class="btn-submit">
                <span id="btn-label">Kirim Tautan Pemulihan</span>
                <i class="ph ph-paper-plane-right" id="btn-icon"></i>
            </button>
        </form>
        
        <a href="/TerraSense-Agri/pages/login.html" class="back-link">
            <i class="ph ph-arrow-left"></i>
            Kembali ke halaman Masuk
        </a>
    </div>

    <script>
    const API = '/TerraSense-Agri/api/forgot-password.php';

    document.getElementById('forgot-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const email = document.getElementById('reset-email').value.trim();
        const btn   = document.getElementById('submit-btn');
        const label = document.getElementById('btn-label');
        const icon  = document.getElementById('btn-icon');

        btn.disabled = true;
        label.textContent = 'Mengirim...';
        icon.className = '';
        icon.innerHTML = '<div class="spinner"></div>';

        try {
            const res  = await fetch(`${API}?action=request`, {
                method : 'POST',
                headers: { 'Content-Type': 'application/json' },
                body   : JSON.stringify({ email }),
            });
            const data = await res.json();

            if (data.success) {
                showAlert('success', '✅ ' + data.message);
                document.getElementById('forgot-form').style.display = 'none';
            } else {
                showAlert('error', '⚠️ ' + (data.message || 'Terjadi kesalahan.'));
                btn.disabled = false;
                label.textContent = 'Kirim Tautan Pemulihan';
                icon.innerHTML = '';
                icon.className = 'ph ph-paper-plane-right';
            }
        } catch (err) {
            showAlert('error', '⚠️ Tidak dapat terhubung ke server. Periksa koneksi Anda.');
            btn.disabled = false;
            label.textContent = 'Kirim Tautan Pemulihan';
            icon.innerHTML = '';
            icon.className = 'ph ph-paper-plane-right';
        }
    });

    function showAlert(type, html) {
        const el = document.getElementById('alert-box');
        el.className = `alert ${type} show`;
        el.innerHTML = html;
    }
    </script>
</body>
</html>
