<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Kata Sandi - TerraSense Agri</title>
    <meta name="description" content="Buat kata sandi baru untuk akun TerraSense Agri Anda.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=DM+Serif+Display:ital@0;1&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --sage:        #5a8a60;
            --sage-light:  #7ab880;
            --terracotta:  #c67b5c;
            --bark:        #f0e8d8;
            --bark-dim:    rgba(240,232,216,0.6);
            --bark-muted:  rgba(240,232,216,0.35);
            --base:        #080d08;
            --surface:     #111811;
            --input-bg:    rgba(255,255,255,0.05);
            --input-border:rgba(255,255,255,0.1);
            --red:         #f87171;
            --emerald:     #34d399;
        }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--base);
            color: var(--bark);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .bg-canvas { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
        .bg-blob { position: absolute; border-radius: 50%; filter: blur(100px); pointer-events: none; }
        .bg-blob-1 { width: 600px; height: 600px; background: radial-gradient(circle, rgba(90,138,96,0.1) 0%, transparent 70%); top: -200px; left: -200px; animation: blobFloat 20s ease-in-out infinite; }
        .bg-blob-2 { width: 500px; height: 500px; background: radial-gradient(circle, rgba(198,123,92,0.07) 0%, transparent 70%); bottom: -150px; right: -150px; animation: blobFloat 25s ease-in-out infinite reverse; }
        .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(90,138,96,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(90,138,96,0.025) 1px, transparent 1px); background-size: 60px 60px; mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 20%, transparent 80%); }

        @keyframes blobFloat { 0%, 100% { transform: translate(0,0) scale(1); } 50% { transform: translate(20px,-30px) scale(1.05); } }

        .auth-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 540px;
            margin: 20px;
            background: #0c130c;
            padding: 48px 44px;
            border-radius: 28px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 40px 120px rgba(0,0,0,0.5);
            animation: cardIn 0.7s cubic-bezier(0.16,1,0.3,1) both;
        }

        @keyframes cardIn { from { opacity: 0; transform: translateY(20px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

        .auth-icon-top { font-size: 48px; color: var(--sage); margin-bottom: 24px; text-align: center; }
        .auth-form-header { margin-bottom: 32px; text-align: center; }
        .auth-form-header h2 { font-family: 'DM Serif Display', serif; font-size: 1.8rem; font-weight: 400; color: var(--bark); margin-bottom: 6px; }
        .auth-form-header p { font-size: 0.85rem; color: var(--bark-muted); line-height: 1.6; }

        .form-group { margin-bottom: 18px; }
        .form-label { display: block; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--bark-muted); margin-bottom: 8px; }
        .form-input-wrap { position: relative; }
        .form-input-wrap .input-icon { position: absolute; top: 50%; transform: translateY(-50%); color: var(--bark-muted); font-size: 18px; pointer-events: none; transition: color 0.2s; }
        .input-icon-left { left: 14px; }
        .input-icon-right { right: 14px; cursor: pointer; pointer-events: all !important; }

        .form-input {
            width: 100%; background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 12px;
            padding: 13px 44px; font-family: 'Inter', sans-serif; font-size: 0.9rem; color: var(--bark); outline: none; transition: all 0.2s ease;
        }
        .form-input:focus { border-color: rgba(90,138,96,0.6); background: rgba(90,138,96,0.05); box-shadow: 0 0 0 3px rgba(90,138,96,0.1); }

        /* Password strength */
        .strength-bar { display: flex; gap: 4px; margin-top: 8px; }
        .strength-segment { height: 3px; flex: 1; border-radius: 2px; background: rgba(255,255,255,0.1); transition: background 0.3s; }
        .strength-label { font-size: 0.72rem; color: var(--bark-muted); margin-top: 4px; }

        .btn-submit {
            width: 100%; padding: 14px; border-radius: 12px; background: linear-gradient(135deg, var(--sage) 0%, #3d7045 100%);
            color: #fff; font-family: 'Inter', sans-serif; font-size: 0.95rem; font-weight: 700; border: none; cursor: pointer;
            box-shadow: 0 4px 20px rgba(90,138,96,0.3); transition: all 0.25s ease; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 8px;
        }
        .btn-submit:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(90,138,96,0.4); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

        .alert { padding: 12px 16px; border-radius: 10px; font-size: 0.85rem; margin-bottom: 16px; display: none; }
        .alert.error { background: rgba(248,113,113,0.12); border: 1px solid rgba(248,113,113,0.3); color: var(--red); }
        .alert.success { background: rgba(52,211,153,0.12); border: 1px solid rgba(52,211,153,0.3); color: var(--emerald); }
        .alert.show { display: flex; align-items: flex-start; gap: 10px; }

        .back-link {
            display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 24px;
            font-size: 0.8rem; color: var(--bark-muted); text-decoration: none; transition: color 0.2s;
        }
        .back-link:hover { color: var(--bark); }

        /* Token checking state */
        #token-loading { text-align: center; padding: 20px 0; display: none; }
        #token-loading.show { display: block; }
        #form-content { display: none; }
        #form-content.show { display: block; }
        #token-invalid { display: none; text-align: center; padding: 10px 0; }
        #token-invalid.show { display: block; }

        .spinner { width: 36px; height: 36px; border: 3px solid rgba(90,138,96,0.2); border-top-color: var(--sage); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="bg-canvas">
        <div class="bg-blob bg-blob-1"></div>
        <div class="bg-blob bg-blob-2"></div>
        <div class="bg-grid"></div>
    </div>

    <div class="auth-wrapper">
        <div class="auth-icon-top"><i class="ph-fill ph-key"></i></div>

        <!-- Loading state -->
        <div id="token-loading" class="show">
            <div class="spinner"></div>
            <p style="color: var(--bark-muted); font-size: 0.9rem;">Memverifikasi token...</p>
        </div>

        <!-- Token invalid state -->
        <div id="token-invalid">
            <div class="auth-form-header">
                <h2 style="color: var(--red);">Token Tidak Valid</h2>
                <p>Tautan ini sudah kadaluarsa atau sudah pernah digunakan.<br>Minta tautan pemulihan baru.</p>
            </div>
            <a href="/TerraSense-Agri/pages/forgot-password.html" class="btn-submit" style="text-decoration:none;margin-top:0;">
                <i class="ph ph-arrow-counter-clockwise"></i>
                Minta Tautan Baru
            </a>
        </div>

        <!-- Reset form -->
        <div id="form-content">
            <div class="auth-form-header">
                <h2>Buat Kata Sandi Baru</h2>
                <p>Masukkan kata sandi baru untuk akun <strong id="reset-email-display"></strong></p>
            </div>

            <div id="alert-box" class="alert"></div>

            <form id="reset-form">
                <div class="form-group">
                    <label class="form-label" for="new-password">Kata Sandi Baru</label>
                    <div class="form-input-wrap">
                        <span class="material-symbols-outlined input-icon input-icon-left">lock</span>
                        <input type="password" id="new-password" class="form-input" placeholder="Minimal 6 karakter" required autocomplete="new-password">
                        <span class="material-symbols-outlined input-icon input-icon-right" id="toggle-pw" onclick="togglePw('new-password','toggle-pw')">visibility</span>
                    </div>
                    <div class="strength-bar">
                        <div class="strength-segment" id="str-1"></div>
                        <div class="strength-segment" id="str-2"></div>
                        <div class="strength-segment" id="str-3"></div>
                        <div class="strength-segment" id="str-4"></div>
                    </div>
                    <div class="strength-label" id="strength-label">Masukkan kata sandi</div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirm-password">Konfirmasi Kata Sandi</label>
                    <div class="form-input-wrap">
                        <span class="material-symbols-outlined input-icon input-icon-left">lock_reset</span>
                        <input type="password" id="confirm-password" class="form-input" placeholder="Ulangi kata sandi" required autocomplete="new-password">
                        <span class="material-symbols-outlined input-icon input-icon-right" id="toggle-cpw" onclick="togglePw('confirm-password','toggle-cpw')">visibility</span>
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="btn-submit">
                    <span>Reset Kata Sandi</span>
                    <i class="ph ph-check-circle"></i>
                </button>
            </form>
        </div>

        <a href="/TerraSense-Agri/pages/login.html" class="back-link">
            <i class="ph ph-arrow-left"></i>
            Kembali ke halaman Masuk
        </a>
    </div>

    <script>
    const API = '/TerraSense-Agri/api/forgot-password.php';
    let validToken = '';

    // ─── Verify token on page load ───────────────────────────────────────────
    (async () => {
        const params = new URLSearchParams(window.location.search);
        const token  = params.get('token') ?? '';

        if (!token || token.length !== 64) {
            showInvalid();
            return;
        }

        try {
            const res  = await fetch(`${API}?action=verify&token=${encodeURIComponent(token)}`);
            const data = await res.json();

            if (data.success) {
                validToken = token;
                document.getElementById('reset-email-display').textContent = data.email;
                document.getElementById('token-loading').classList.remove('show');
                document.getElementById('form-content').classList.add('show');
            } else {
                showInvalid(data.message);
            }
        } catch {
            showInvalid('Gagal menghubungi server.');
        }
    })();

    function showInvalid(msg = '') {
        document.getElementById('token-loading').classList.remove('show');
        document.getElementById('token-invalid').classList.add('show');
    }

    // ─── Password strength ───────────────────────────────────────────────────
    document.getElementById('new-password').addEventListener('input', function () {
        const pw = this.value;
        let score = 0;
        if (pw.length >= 6)  score++;
        if (pw.length >= 10) score++;
        if (/[A-Z]/.test(pw) && /[a-z]/.test(pw)) score++;
        if (/[0-9!@#$%^&*]/.test(pw)) score++;

        const colors = ['#f87171','#fb923c','#facc15','#34d399'];
        const labels = ['Lemah','Cukup','Kuat','Sangat Kuat'];
        [1,2,3,4].forEach(i => {
            const el = document.getElementById('str-' + i);
            el.style.background = i <= score ? colors[score - 1] : 'rgba(255,255,255,0.1)';
        });
        document.getElementById('strength-label').textContent = score > 0 ? labels[score - 1] : 'Masukkan kata sandi';
    });

    // ─── Toggle password visibility ──────────────────────────────────────────
    function togglePw(inputId, iconId) {
        const inp  = document.getElementById(inputId);
        const icon = document.getElementById(iconId);
        inp.type   = inp.type === 'password' ? 'text' : 'password';
        icon.textContent = inp.type === 'password' ? 'visibility' : 'visibility_off';
    }

    // ─── Submit form ─────────────────────────────────────────────────────────
    document.getElementById('reset-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        const pw  = document.getElementById('new-password').value;
        const cpw = document.getElementById('confirm-password').value;

        if (pw !== cpw) {
            showAlert('error', 'Kata sandi tidak cocok. Periksa kembali.');
            return;
        }
        if (pw.length < 6) {
            showAlert('error', 'Kata sandi harus minimal 6 karakter.');
            return;
        }

        const btn = document.getElementById('submit-btn');
        btn.disabled = true;
        btn.innerHTML = '<div class="spinner" style="width:20px;height:20px;margin:0;border-width:2px;"></div> Menyimpan...';

        try {
            const res  = await fetch(`${API}?action=reset`, {
                method : 'POST',
                headers: { 'Content-Type': 'application/json' },
                body   : JSON.stringify({ token: validToken, password: pw }),
            });
            const data = await res.json();

            if (data.success) {
                showAlert('success', '✅ ' + data.message);
                btn.style.display = 'none';
                setTimeout(() => window.location.href = '/TerraSense-Agri/pages/login.html', 2500);
            } else {
                showAlert('error', data.message);
                btn.disabled = false;
                btn.innerHTML = '<span>Reset Kata Sandi</span><i class="ph ph-check-circle"></i>';
            }
        } catch {
            showAlert('error', 'Gagal menghubungi server. Coba lagi.');
            btn.disabled = false;
            btn.innerHTML = '<span>Reset Kata Sandi</span><i class="ph ph-check-circle"></i>';
        }
    });

    function showAlert(type, message) {
        const el = document.getElementById('alert-box');
        el.className = `alert ${type} show`;
        el.innerHTML = `<i class="ph ph-${type === 'error' ? 'warning' : 'check-circle'}"></i><span>${message}</span>`;
    }
    </script>
</body>
</html>
