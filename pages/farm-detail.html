<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Detail Lahan - TerraSense Agri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=DM+Serif+Display:ital@0;1&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
    --sage:         #5a8a60;
    --sage-light:   #7ab880;
    --sage-dim:     rgba(90,138,96,0.12);
    --terracotta:   #c67b5c;
    --terra-dim:    rgba(198,123,92,0.12);
    --bark:         #f0e8d8;
    --bark-dim:     rgba(240,232,216,0.6);
    --bark-muted:   rgba(240,232,216,0.35);
    --bark-faint:   rgba(240,232,216,0.15);
    --base:         #080d08;
    --surface:      #0f160f;
    --surface-2:    #141c14;
    --surface-3:    #192019;
    --card:         rgba(255,255,255,0.03);
    --card-border:  rgba(255,255,255,0.07);
    --card-hover:   rgba(255,255,255,0.06);
    --sidebar-w:    248px;
    --topbar-h:     64px;
}

html, body { height: 100%; }

body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--base);
    color: var(--bark);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    line-height: 1.5;
}

/* ===== SIDEBAR ===== */
#sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: var(--sidebar-w); background: var(--surface); border-right: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; z-index: 60; transition: transform 0.3s cubic-bezier(0.16,1,0.3,1); overflow: hidden; }
.sidebar-brand { padding: 20px 20px 16px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.sidebar-brand-icon { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, var(--sage), #3d7045); display: flex; align-items: center; justify-content: center; font-size: 18px; box-shadow: 0 4px 12px rgba(90,138,96,0.3); flex-shrink: 0; }
.sidebar-brand-text h1 { font-family: 'DM Serif Display', serif; font-size: 1.1rem; color: var(--bark); line-height: 1; }
.sidebar-brand-text span { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--bark-muted); }
.sidebar-nav { flex: 1; padding: 12px; overflow-y: auto; overflow-x: hidden; }
.nav-section-label { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; color: var(--bark-faint); padding: 16px 12px 8px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; text-decoration: none; color: var(--bark-muted); font-size: 0.875rem; font-weight: 500; transition: all 0.2s ease; cursor: pointer; margin-bottom: 2px; position: relative; }
.nav-item:hover { background: var(--card-hover); color: var(--bark-dim); }
.nav-item.active { background: var(--sage-dim); color: var(--sage-light); font-weight: 600; }
.nav-item.active::before { content: ''; position: absolute; left: 0; top: 20%; bottom: 20%; width: 3px; background: var(--sage-light); border-radius: 0 3px 3px 0; }
.nav-item .nav-icon { font-size: 18px; flex-shrink: 0; width: 20px; text-align: center; }
.nav-item .nav-chevron { margin-left: auto; font-size: 14px; transition: transform 0.2s; }
.nav-item.expanded .nav-chevron { transform: rotate(180deg); }
.nav-sub { overflow: hidden; max-height: 0; transition: max-height 0.3s ease; padding-left: 32px; }
.nav-sub.open { max-height: 300px; }
.nav-sub-item { display: block; padding: 7px 12px; border-radius: 8px; text-decoration: none; color: var(--bark-muted); font-size: 0.8rem; font-weight: 500; transition: all 0.15s; margin-bottom: 2px; }
.nav-sub-item:hover { color: var(--bark-dim); background: rgba(255,255,255,0.03); }
.sidebar-bottom { padding: 12px 12px 16px; border-top: 1px solid rgba(255,255,255,0.05); flex-shrink: 0; }

/* ===== TOPBAR ===== */
#topbar { position: fixed; top: 0; left: var(--sidebar-w); right: 0; height: var(--topbar-h); background: rgba(8,13,8,0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.06); z-index: 50; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; transition: left 0.3s cubic-bezier(0.16,1,0.3,1); }
.topbar-left { display: flex; align-items: center; gap: 16px; }
.topbar-toggle { width: 36px; height: 36px; border-radius: 10px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--bark-muted); }
.topbar-title { font-family: 'DM Serif Display', serif; font-size: 1.25rem; color: var(--bark); }
.topbar-right { display: flex; align-items: center; gap: 12px; }
.topbar-avatar { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, var(--sage-dim), rgba(90,138,96,0.2)); border: 1px solid rgba(90,138,96,0.25); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--sage-light); font-size: 20px; }

/* ===== MAIN CONTENT ===== */
#main-content { margin-left: var(--sidebar-w); padding-top: var(--topbar-h); min-height: 100vh; transition: margin-left 0.3s cubic-bezier(0.16,1,0.3,1); }
.content-inner { padding: 32px 28px; max-width: 1400px; margin: 0 auto; }

.farm-header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
.farm-title { font-family: 'DM Serif Display', serif; font-size: 2rem; line-height: 1.1; }
.farm-meta { display: flex; gap: 14px; flex-wrap: wrap; color: var(--bark-muted); font-size: 0.85rem; margin-top: 6px; }
.farm-meta span { display: inline-flex; align-items: center; gap: 4px; }

.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 10px; font: inherit; font-size: 0.82rem; font-weight: 600; cursor: pointer; text-decoration: none; border: 1px solid var(--card-border); background: var(--surface-3); color: var(--bark); transition: all 0.2s; }
.btn:hover { background: var(--card-hover); }
.btn-sage { background: var(--sage); border-color: var(--sage); color: #fff; }
.btn-terra { background: var(--terracotta); border-color: var(--terracotta); color: #fff; }
.btn-sage:hover, .btn-terra:hover { filter: brightness(1.1); background: inherit; }
.btn-sage:hover { background: var(--sage); }
.btn-terra:hover { background: var(--terracotta); }
.btn-ghost { background: transparent; }
.btn-sm { padding: 5px 9px; font-size: 0.75rem; border-radius: 8px; }

.top-grid { display: grid; grid-template-columns: 1fr 1.6fr; gap: 24px; margin-bottom: 24px; }
.panel { background: var(--surface-2); border: 1px solid var(--card-border); border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; }
.panel-header { padding: 18px 24px; border-bottom: 1px solid var(--card-border); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.panel-title { font-family: 'DM Serif Display', serif; font-size: 1.2rem; color: var(--bark); }
.panel-body { padding: 24px; flex: 1; }
#mini-map { height: 100%; min-height: 280px; }

.cycle-crop { font-family: 'DM Serif Display', serif; font-size: 1.6rem; }
.stage-badge { display: inline-flex; padding: 3px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 700; background: var(--sage-dim); color: var(--sage-light); border: 1px solid rgba(90,138,96,0.3); text-transform: uppercase; letter-spacing: 0.05em; }
.progress { height: 8px; background: rgba(255,255,255,0.06); border-radius: 4px; overflow: hidden; margin: 14px 0 6px; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--sage), var(--sage-light)); border-radius: 4px; }
.progress-labels { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--bark-muted); }
.mini-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 18px 0; }
.mini-stat { background: var(--card); border: 1px solid var(--card-border); border-radius: 12px; padding: 12px 14px; }
.mini-stat-label { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--bark-muted); margin-bottom: 4px; }
.mini-stat-val { font-size: 1rem; font-weight: 600; color: var(--bark); }
.mini-stat-sub { font-size: 0.72rem; color: var(--bark-dim); margin-top: 2px; }
.cycle-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.empty-state { text-align: center; padding: 36px 16px; color: var(--bark-muted); }
.empty-state i { font-size: 36px; display: block; margin-bottom: 8px; }

.bottom-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 24px; }

/* Timeline */
.type-filter { display: flex; gap: 6px; flex-wrap: wrap; }
.type-chip { padding: 4px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 600; border: 1px solid var(--card-border); background: transparent; color: var(--bark-muted); cursor: pointer; font-family: inherit; }
.type-chip.active { background: var(--sage-dim); color: var(--sage-light); border-color: rgba(90,138,96,0.4); }
.timeline { list-style: none; position: relative; }
.timeline::before { content: ''; position: absolute; left: 17px; top: 4px; bottom: 4px; width: 2px; background: var(--card-border); }
.tl-item { display: flex; gap: 14px; padding: 10px 0; position: relative; }
.tl-icon { width: 36px; height: 36px; border-radius: 50%; background: var(--surface-3); border: 2px solid var(--card-border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; z-index: 1; font-size: 16px; }
.tl-body { flex: 1; min-width: 0; }
.tl-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.tl-type { font-size: 0.85rem; font-weight: 600; }
.tl-date { font-size: 0.72rem; color: var(--bark-muted); white-space: nowrap; }
.tl-desc { font-size: 0.82rem; color: var(--bark-dim); margin-top: 2px; }
.tl-notes { font-size: 0.78rem; color: var(--bark-muted); margin-top: 2px; font-style: italic; white-space: pre-line; }
.tl-cost { font-size: 0.72rem; color: var(--terracotta); margin-top: 2px; }
.tl-del { background: none; border: none; color: var(--bark-faint); cursor: pointer; font-size: 14px; padding: 2px; }
.tl-del:hover { color: var(--terracotta); }

/* History */
.history-item { border: 1px solid var(--card-border); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; transition: all 0.2s; background: var(--card); }
.history-item:hover { background: var(--card-hover); }
.history-item.selected { border-color: rgba(90,138,96,0.5); background: var(--sage-dim); }
.history-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.history-crop { font-weight: 600; }
.status-badge { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; padding: 2px 8px; border-radius: 6px; }
.status-aktif { background: var(--sage-dim); color: var(--sage-light); }
.status-dipanen { background: rgba(234,179,8,0.15); color: #fde047; }
.status-gagal { background: var(--terra-dim); color: #f0a282; }
.history-meta { font-size: 0.75rem; color: var(--bark-muted); margin-top: 4px; }
.history-stats { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.78rem; color: var(--bark-dim); margin-top: 8px; }
.history-stats strong { color: var(--bark); }

/* Responsive */
#sidebar-overlay { display: none; position: fixed; inset: 0; z-index: 55; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
body.sidebar-hidden #sidebar { transform: translateX(-100%); }
body.sidebar-hidden #topbar { left: 0; }
body.sidebar-hidden #main-content { margin-left: 0; }

@media (max-width: 1024px) {
    .top-grid, .bottom-grid { grid-template-columns: 1fr; }
}
@media (max-width: 767px) {
    #sidebar { transform: translateX(-100%); }
    body.sidebar-open #sidebar { transform: translateX(0); }
    body.sidebar-open #sidebar-overlay { display: block; }
    #topbar { left: 0 !important; padding: 0 16px; }
    #main-content { margin-left: 0 !important; }
    .content-inner { padding: 24px 16px; }
    .farm-title { font-size: 1.6rem; }
}
</style>
</head>
<body>
<div id="sidebar-overlay" onclick="toggleSidebar()"></div>

<!-- ===== SIDEBAR ===== -->
<aside id="sidebar">
    <div class="sidebar-brand">
        <div class="sidebar-brand-icon">🌿</div>
        <div class="sidebar-brand-text">
            <h1>TerraSense</h1>
            <span>Precision Farming</span>
        </div>
    </div>
    <nav class="sidebar-nav">
        <div class="nav-section-label">Menu Utama</div>
        <a class="nav-item" href="/TerraSense-Agri/pages/dashboard.html">
            <i class="ph-fill ph-house-line nav-icon"></i> <span>Beranda</span>
        </a>
        <a class="nav-item" href="/TerraSense-Agri/pages/farm-map.html">
            <i class="ph-fill ph-map-trifold nav-icon"></i> <span>Peta Lahan</span>
        </a>
        <div>
            <div class="nav-item active expanded" id="toggle-daftar-lahan" onclick="toggleSubNav(this, 'sidebar-farms-list')">
                <i class="ph ph-list nav-icon"></i> <span>Daftar Lahan</span>
                <i class="ph ph-caret-down nav-chevron"></i>
            </div>
            <div class="nav-sub open" id="sidebar-farms-list">
                <div style="font-size:0.75rem;color:var(--bark-faint);padding:8px 12px;font-style:italic;">Memuat lahan...</div>
            </div>
        </div>
        <a class="nav-item" href="/TerraSense-Agri/pages/harvest-report.html">
            <i class="ph-fill ph-chart-bar nav-icon"></i> <span>Laporan Panen</span>
        </a>
        <div class="nav-section-label">Akun</div>
        <a class="nav-item" href="/TerraSense-Agri/pages/profile.html">
            <i class="ph-fill ph-user-circle nav-icon"></i> <span>Profil Saya</span>
        </a>
    </nav>
</aside>

<!-- ===== TOPBAR ===== -->
<header id="topbar">
    <div class="topbar-left">
        <button class="topbar-toggle" onclick="toggleSidebar()">
            <span class="material-symbols-outlined" style="font-size:20px;">menu</span>
        </button>
        <h2 class="topbar-title">Riwayat Lahan</h2>
    </div>
    <div class="topbar-right">
        <div class="topbar-avatar" onclick="window.location.href='/TerraSense-Agri/pages/profile.html'">
            <i class="ph-fill ph-user" style="font-size:18px;"></i>
        </div>
    </div>
</header>

<!-- ===== MAIN CONTENT ===== -->
<main id="main-content">
    <div class="content-inner">
        <div class="farm-header">
            <div>
                <h1 class="farm-title" id="farm-name">Memuat lahan...</h1>
                <div class="farm-meta" id="farm-meta"></div>
            </div>
            <a class="btn" id="btn-open-map" href="/TerraSense-Agri/pages/farm-map.html"><i class="ph ph-map-trifold"></i> Buka di Peta</a>
        </div>

        <div class="top-grid">
            <div class="panel">
                <div id="mini-map"></div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <h3 class="panel-title">Musim Tanam Aktif</h3>
                    <span class="stage-badge" id="active-stage" style="display:none;"></span>
                </div>
                <div class="panel-body" id="active-cycle-body">
                    <div class="empty-state"><i class="ph ph-spinner"></i>Memuat...</div>
                </div>
            </div>
        </div>

        <div class="bottom-grid">
            <div class="panel">
                <div class="panel-header">
                    <div>
                        <h3 class="panel-title">Catatan Kegiatan</h3>
                        <div style="font-size:0.75rem;color:var(--bark-muted);" id="timeline-caption"></div>
                    </div>
                    <div class="type-filter" id="type-filter">
                        <button class="type-chip active" data-type="all" type="button">Semua</button>
                        <button class="type-chip" data-type="pupuk" type="button">Pupuk</button>
                        <button class="type-chip" data-type="pengairan" type="button">Pengairan</button>
                        <button class="type-chip" data-type="observasi" type="button">Observasi</button>
                        <button class="type-chip" data-type="lainnya" type="button">Lainnya</button>
                    </div>
                </div>
                <div class="panel-body">
                    <ul class="timeline" id="timeline"></ul>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <h3 class="panel-title">Riwayat Musim Tanam</h3>
                </div>
                <div class="panel-body" id="history-list"></div>
            </div>
        </div>
    </div>
</main>

<script src="/TerraSense-Agri/assets/js/app.js?v=5"></script>
<script src="/TerraSense-Agri/assets/js/cycle-ui.js?v=3"></script>
<script src="/TerraSense-Agri/assets/js/farm-detail.js?v=2"></script>
<script>
function toggleSidebar() {
    if (window.innerWidth >= 768) {
        document.body.classList.toggle('sidebar-hidden');
    } else {
        document.body.classList.toggle('sidebar-open');
    }
    setTimeout(() => { if (window.miniMap) window.miniMap.invalidateSize(); }, 300);
}
function toggleSubNav(el, subId) {
    const sub = document.getElementById(subId);
    const isOpen = sub.classList.contains('open');
    sub.classList.toggle('open', !isOpen);
    el.classList.toggle('expanded', !isOpen);
}
</script>
</body>
</html>
